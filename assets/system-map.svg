<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-labelledby="title desc">
  <title id="title">How the companions stand</title>
  <desc id="desc">Human intent reaches MOMO. MOMO watches. KIBI connects. KIJI, INNU, and SARU remain themselves, then act in the world.</desc>
  <rect width="640" height="720" fill="#fff8f1"/>
  <text x="320" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#7a6156">Human is outside the system</text>

  <rect x="200" y="52" width="240" height="56" rx="28" fill="#2c211c"/>
  <text x="320" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#fff8f1">Human</text>

  <path d="M320 108 v28" stroke="#c9a48c" stroke-width="2"/>
  <text x="338" y="128" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#7a6156">intent</text>

  <rect x="176" y="140" width="288" height="72" rx="20" fill="#f4c7b0"/>
  <text x="320" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#2c211c">MOMO</text>
  <text x="320" y="196" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="13" fill="#6a4030">sees the whole · does not control it</text>

  <path d="M320 212 v28" stroke="#c9a48c" stroke-width="2"/>

  <rect x="188" y="244" width="264" height="60" rx="18" fill="#efe0c8"/>
  <text x="320" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2c211c">KIBI</text>
  <text x="320" y="290" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="12" fill="#6a4030">connects · does not supervise</text>

  <path d="M320 304 v24" stroke="#c9a48c" stroke-width="2"/>
  <path d="M120 352 H520" stroke="#e6d3c2" stroke-width="2"/>
  <path d="M120 328 v24 M320 328 v24 M520 328 v24" stroke="#c9a48c" stroke-width="2"/>

  <rect x="36" y="352" width="168" height="88" rx="16" fill="#e8f0e4"/>
  <text x="120" y="388" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#2c211c">KIJI</text>
  <text x="120" y="414" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="13" fill="#4d5f45">sees the world</text>

  <rect x="236" y="352" width="168" height="88" rx="16" fill="#f3e6d2"/>
  <text x="320" y="388" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#2c211c">INNU</text>
  <text x="320" y="414" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="13" fill="#6a4d32">builds</text>

  <rect x="436" y="352" width="168" height="88" rx="16" fill="#e7eef4"/>
  <text x="520" y="388" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#2c211c">SARU</text>
  <text x="520" y="414" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="13" fill="#3d5366">acts in the world</text>

  <path d="M120 440 v36 H520 v-36" fill="none" stroke="#c9a48c" stroke-width="2"/>
  <path d="M320 476 v24" stroke="#c9a48c" stroke-width="2"/>

  <rect x="168" y="504" width="304" height="64" rx="20" fill="#2c211c"/>
  <text x="320" y="542" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#fff8f1">Human society</text>

  <text x="320" y="604" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#2c211c">Companions stay themselves.</text>
  <text x="320" y="628" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="13" fill="#7a6156">This is a picture of roles, not a fixed pipeline.</text>
  <text x="320" y="668" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="12" fill="#9a7d70">Formal KIBI split is not finished. This is the intended direction.</text>
</svg>
